<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Maximus" />
    <style>
      html, body, #root { background: #000; }
      body { margin: 0; }
      /* Push all app content below the notch / dynamic island and above the
         home indicator. Applied on #root (not body) so children using
         `h-screen` / `min-h-screen` still start below the safe area. */
      #root {
        min-height: 100vh;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        box-sizing: border-box;
      }
      /* Utility classes for pages that need per-element control. */
      .pt-safe { padding-top: env(safe-area-inset-top); }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      .h-screen-safe {
        height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      }
    </style>

    <title>Maximus Solutions Group</title>
    <meta name="description" content="Maximus Solutions Group — Trusted home services, on demand." />
    <meta name="author" content="Maximus Solutions Group" />

    <meta property="og:title" content="Maximus Solutions Group" />
    <meta property="og:description" content="Trusted home services, on demand. Request. Match. Done." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/logo.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
